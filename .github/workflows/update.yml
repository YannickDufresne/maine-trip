name: Update weather forecast

on:
  schedule:
    # Run every 4 hours (00:05, 04:05, 08:05, 12:05, 16:05, 20:05 UTC)
    # The :05 offset avoids GitHub Actions cron contention at the top of the hour
    - cron: "5 */4 * * *"
  workflow_dispatch:  # also allow manual run from the Actions tab

# Avoid concurrent runs stepping on each other
concurrency:
  group: weather-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to commit the updated index.html
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run weather updater
        run: python scripts/update_weather.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain index.html)" ]]; then
            git add index.html
            git commit -m "chore: refresh weather forecast"
            git push
          else
            echo "No changes to commit."
          fi
