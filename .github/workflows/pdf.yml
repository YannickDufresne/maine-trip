name: Generate PDF from index.html
on:
  workflow_run:
    workflows: ["Update weather forecast"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install WeasyPrint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2
          pip install weasyprint
      - name: Generate PDF
        run: |
          echo "" | base64 -d > /tmp/gen.py
          python3 /tmp/gen.py
      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add maine-trip-book.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes"
          else
            git commit -m "chore: regenerate PDF from index.html"
            git push
          fi
