name: Patch 2 - dynamic implication
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          echo "" | base64 -d | python3
      - name: Run weather update to populate dynamic implication
        run: python3 scripts/update_weather.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Make implication concrete dynamic"
            git push
          fi
